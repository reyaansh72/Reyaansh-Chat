name: 🚀 Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: 🌐 Web Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🌐 Build Web Release
        run: |
          flutter build web --release \
            --dart-define=NOTIFICATION_BACKEND_URL=https://Reyaansh-Chat.onrender.com

      - name: 📁 Prepare release artifacts
        run: |
          mkdir -p artifacts
          cd build/web
          zip -r ../../artifacts/Reyaansh-Chat-Web.zip .

      - name: 🏷 Generate version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags

          LAST_TAG=$(git tag -l "v*" | sed 's/^v//' | sort -V | tail -n 1 || true)

          if [ -z "$LAST_TAG" ]; then
            NEXT="1"
          else
            IFS='.' read -r -a parts <<< "$LAST_TAG"
            last_index=$(( ${#parts[@]} - 1 ))

            if [[ "${parts[$last_index]}" =~ ^[0-9]+$ ]]; then
              parts[$last_index]=$(( parts[$last_index] + 1 ))
              NEXT=$(IFS='.'; echo "${parts[*]}")
            else
              NEXT="${LAST_TAG}.1"
            fi
          fi

          TAG="v$NEXT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/Reyaansh-Chat-Web.zip
